<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ titulo }} | OwlConvenial</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#eef5f1;font-family:Arial,sans-serif;color:#263a32}.cartao{width:min(100%,520px);padding:36px;background:white;border-radius:18px;box-shadow:0 12px 36px #173f2b18;text-align:center}h1{color:#2D7F62}p{line-height:1.6}.botao{display:inline-block;margin-top:12px;padding:13px 20px;border-radius:10px;background:#2D7F62;color:white;text-decoration:none;font-weight:bold}
  </style>
</head>
<body>
  <main class="cartao">
    <h1>{{ titulo }}</h1>
    <p>{{ mensagem }}</p>
    <a class="botao" href="{{ url_for('index') }}">Voltar ao início</a>
  </main>
</body>
</html>
