<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - OwlConvenial</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/cadastro.css') }}">
</head>

<body>

    {% include '_mensagens.html' %}

    <div class="card">

        <div class="logo">🦉</div>

        <h1>OwlConvenial</h1>

        <p>
            Crie sua conta e encontre hospitais próximos com facilidade.
        </p>

        <form action="/cadastro" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

            <div class="grupo">
                <label for="nome">Nome Completo</label>

                <input
                    type="text"
                    id="nome"
                    name="nome"
                    placeholder="Digite seu nome"
                    value="{{ request.form.get('nome', '') }}"
                    maxlength="150"
                    required
                >
            </div>

            <div class="grupo">
                <label for="email">E-mail (opcional se informar telefone)</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Digite seu e-mail"
                    value="{{ request.form.get('email', '') }}"
                    maxlength="200"
                >
            </div>

            <div class="grupo">
                <label for="telefone">Telefone (opcional se informar e-mail)</label>
                <input id="telefone" type="tel" name="telefone" placeholder="(11) 99999-9999" autocomplete="tel" value="{{ request.form.get('telefone', '') }}" maxlength="20">
            </div>

            <div class="grupo">
                <label for="cpf">CPF</label>

                <input
                    type="text"
                    id="cpf"
                    name="cpf"
                    placeholder="000.000.000-00"
                    maxlength="14"
                    value="{{ request.form.get('cpf', '') }}"
                    required
                >
            </div>

            <div class="grupo">
                <label for="genero">Gênero</label>

                <select
                    id="genero"
                    name="genero"
                    required
                >
                    <option value="">Selecione...</option>
                    <option value="Masculino" {% if request.form.get('genero') == 'Masculino' %}selected{% endif %}>Masculino</option>
                    <option value="Feminino" {% if request.form.get('genero') == 'Feminino' %}selected{% endif %}>Feminino</option>
                    <option value="Não Binário" {% if request.form.get('genero') == 'Não Binário' %}selected{% endif %}>Não Binário</option>
                    <option value="Outro" {% if request.form.get('genero') == 'Outro' %}selected{% endif %}>Outro</option>
                    <option value="Prefiro não informar" {% if request.form.get('genero') == 'Prefiro não informar' %}selected{% endif %}>Prefiro não informar</option>
                </select>
            </div>

            <div class="grupo">
                <label for="data_nascimento">Data de Nascimento</label>

                <input
                    type="date"
                    id="data_nascimento"
                    name="data_nascimento"
                    value="{{ request.form.get('data_nascimento', '') }}"
                    required
                >
            </div>

            <div class="grupo">
                <label for="senha">Senha (mínimo 8 caracteres)</label>

                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Digite sua senha"
                    minlength="8"
                    maxlength="72"
                    required
                >
            </div>

            <button type="submit">

                Criar Conta

            </button>

        </form>

        <div class="login">

            Já possui uma conta?

            <a href="/login">

                Entrar

            </a>

        </div>

    </div>

</body>
</html>
