<!DOCTYPE html>
<html lang="pt-br">
<head>

    <title>Login</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='css/login.css') }}">

    <style>

      .cadastro-box{
  
          margin-top:15px;
          text-align:center;
          font-size:15px;
  
      }
  
      .cadastro-box p{
  
          margin:0;
          color:#f5f5f5;
  
      }
  
      .cadastre-se{
  
          color:#bdbdbd;
          font-weight:600;
          text-decoration:none;
          transition:.25s;
  
      }
  
      .cadastre-se:hover{
  
          color:#ffffff;
          text-decoration:underline;
  
      }
  
  </style>

</head>

<body>

    {% include '_mensagens.html' %}

    <!-- Logo -->
    <a href="static/Assets/img/logo.png">

        <img src="{{ url_for('static',
        filename='Assets/img/logo.png') }}">

    </a>

    <div class="container mt-5">

        <h2>Realize seu Login!</h2>

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

            <input
                class="form-control mb-3"
                type="text"
                name="identificador"
                required
                placeholder="E-mail ou telefone"
            />

            <input
                class="form-control mb-3"
                type="password"
                name="senha"
                placeholder="Senha"
                required
            />

            <button class="btn btn-primary">

                Entrar

            </button>

            <div class="cadastro-box">

                <p>

                    Não possui uma conta?

                    <a href="/cadastro" class="cadastre-se">

                        Cadastre-se

                    </a>

                </p>

            </div>

            <div class="cadastro-box">
                <a href="/reenviar-verificacao" class="cadastre-se">Não recebeu o e-mail de confirmação?</a>
            </div>

        </form>

    </div>

</body>
</html>
