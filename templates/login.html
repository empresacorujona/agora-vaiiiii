<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar | OwlConvenial</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>
  {% include '_mensagens.html' %}
  <main class="login-card">
    <a class="logo" href="{{ url_for('index') }}" aria-label="OwlConvenial - início">
      <img src="{{ url_for('static', filename='Assets/img/logo.png') }}" alt="Logo OwlConvenial">
    </a>
    <h1>Entre na sua conta</h1>
    <p class="orientacao">Após validar a senha, enviaremos um código de acesso às contas que têm um e-mail confirmado.</p>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label for="identificador">E-mail ou telefone</label>
      <input id="identificador" type="text" name="identificador" autocomplete="username" value="{{ request.form.get('identificador', '') }}" required autofocus>
      <label for="senha">Senha</label>
      <input id="senha" type="password" name="senha" autocomplete="current-password" required>
      <button type="submit">Entrar</button>
    </form>
    <nav class="links" aria-label="Opções da conta">
      <a href="{{ url_for('auth.cadastro') }}">Criar uma conta</a>
      <a href="{{ url_for('auth.reenviar_verificacao') }}">Precisa confirmar seu e-mail?</a>
    </nav>
  </main>
</body>
</html>
